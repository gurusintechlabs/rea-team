[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rea-team"
version = "0.2.0"
description = "Feature-by-feature clean-room rebuilds of legacy software with Claude Code (+ REA), with regression gates and resume"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rea-team = "rea_team.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rea_team = ["templates/**/*", "templates/**/.claude/agents/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
